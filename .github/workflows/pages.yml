name: Pages

# Publishes the download page: site/ at the root, the shared cat scene from web/ under cat/ (the
# page's live demo), and stats.json with the download count. Runs again every few hours, so
# stats.json stays close to the live count the page also asks for. Not on release: that event
# runs on the tag, and the github-pages environment only accepts deploys from main.
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'docs/screenshots/keycat.gif', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Upload and deploy are separate jobs: in one job deploy-pages sometimes looks the artifact up a
# few hundred ms after it is finalized, finds nothing and fails, so stats.json stopped updating
# (actions/deploy-pages#451). A job boundary gives the lookup seconds instead.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/cat
          cp -R site/. _site/
          cp -R web/. _site/cat/
          cp docs/screenshots/keycat.gif _site/
          # Every macOS zip and Windows installer across all releases; checksums and update
          # manifests are left out.
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '
            map(select(.draft or .prerelease | not))
            | { downloads: ([.[].assets[] | select(.name | test("\\.(zip|exe)$"; "i")) | .download_count] | add // 0),
                version: (.[0].tag_name // ""), published: (.[0].published_at // ""), updated: (now | todate) }' > _site/stats.json
          cat _site/stats.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
